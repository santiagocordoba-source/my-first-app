<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegio Bolívar - Contador de Eventos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 6px solid #003366;
        }

        h1 {
            color: #003366;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .counter-display {
            font-size: 4rem;
            font-weight: bold;
            color: #d9272e;
            margin: 1rem 0;
        }

        .btn {
            background-color: #003366;
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
            font-weight: 600;
        }

        .btn:hover {
            background-color: #002244;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Colegio Bolívar</h1>
        <p>Registro de Asistencia a Eventos</p>
        
        <div class="counter-display" id="counter">0</div>
        
        <button class="btn" id="incrementBtn">Registrar Clic</button>
    </div>

    <script>
        let count = 0;

        const counterDisplay = document.getElementById('counter');
        const incrementBtn = document.getElementById('incrementBtn');

        incrementBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
        });
    </script>

</body>
</html>
